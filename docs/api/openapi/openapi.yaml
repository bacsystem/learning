openapi: 3.1.0
# Capacitate API: raíz del spec (ADR 0012, docs/adr/0012-documentacion-openapi-spec-first.md).
# Plan de trabajo y reparto: docs/api/openapi-plan.md.
#
# Reglas de este archivo:
# - Solo `info`, `servers`, `security`, `tags`, `components` comunes y `paths`.
# - Cada entrada de `paths` es solo un `$ref` al archivo de su paquete Go:
#     /ruta:
#       $ref: './paquetes/<paquete>.yaml#/paths/~1ruta'
#   (en el puntero JSON, `/` se escribe `~1` y `~` se escribe `~0`).
# - Cada dev escribe solo en el bloque reservado de su paquete. Un componente
#   común nuevo se pide al architect; no se duplica en los paquetes.
# - Los ejemplos son sintéticos (@example.com, DNI 00000000, «Persona Ejemplo»).
#   El repo es público: nunca datos de assets/, de la base ni de logs.
info:
  title: Capacitate API
  version: 0.0.0-dev
  summary: API de práctica y simulacros para los exámenes de ascenso, con panel de administración.
  description: |
    Documentación de la API de Capacitate (backend Go sobre `net/http.ServeMux`).

    **Fuente de verdad de la forma** de cada endpoint (ruta, método, rol,
    parámetros, request, response y códigos de error). Los contratos de
    diseño (reglas, modelo de datos, migraciones) siguen en `docs/api/*.md`.
    Un test de Go (`backend/internal/apispec`) compara este spec con las rutas
    registradas y con el rol que aplica cada middleware.

    ## Roles (`x-rol`)

    Cada operación declara `x-rol`:

    | Valor | Significado | Middleware |
    |---|---|---|
    | `publico` | Sin sesión (`security: []`). Algunas rutas tienen rate limit (429) | ninguno o `Limit` |
    | `autenticado` | Cualquier sesión válida: `usuario` (postulante) o `admin` | `RequireAuth` |
    | `admin` | Solo el rol `admin` | `RequireAuth` + `RequireAdmin` |

    El rol se lee de la base en cada request, no del token. Tampoco se deduce
    del prefijo de la ruta: hay rutas de admin fuera de `/admin` y rutas bajo
    `/admin` abiertas a cualquier sesión.

    Las operaciones `autenticado` responden `401` (`NoAutenticado`) y `503`
    (`ServicioNoDisponible`); las `admin`, además, `403` (`AccesoDenegado`).

    ## Errores

    Conviven dos formatos; cada respuesta documenta el que devuelve su handler:

    - `ErrorCodigo`: `{"error": "<codigo>", "message": "<texto>", "detalle": {…}}`.
      El código es el contrato estable; `message` va en español y solo sirve
      para logs del cliente.
    - `ErrorTexto`: `{"error": "<texto>"}`, el formato heredado. Lo usan los
      middlewares de sesión y rol (401, 403, 503), el rate limiter (429) y los
      handlers anteriores al módulo SERUMS IA.

    ## Paginación

    Sobre `{"data": [...], "total": n, "page": p, "per_page": pp}`
    (`PaginaMeta` + `data`). Cada listado dice si su parámetro es **estricto**
    (`400` si el valor es inválido) o **tolerante** (cae al valor por defecto).
    Los catálogos usan `limit` (entero o `all`) en lugar de `per_page`.

    ## Formatos

    JSON en `snake_case`; fechas en RFC 3339 UTC; los nulos se declaran como
    `type: [<tipo>, "null"]`. Cuerpo JSON máximo: 1 MB (413).
servers:
  - url: http://localhost:8080
    description: Desarrollo local (`make dev`)
security:
  - bearerAuth: []
tags:
  - name: server
    description: Estado del proceso (`cmd/server`).
  - name: auth
    description: Cuenta, sesión, registro, idioma y tour; administración de personas, usuarios, sesiones y configuración.
  - name: admin
    description: Panel de administración, detalle y rol de usuarios, auditoría e ingresos.
  - name: catalogs
    description: Instituciones, grados, especialidades, asignaturas, procesos y pesos.
  - name: temas
    description: Temas por asignatura (SERUMS IA, E1).
  - name: perfiles
    description: Profesión del postulante (SERUMS IA, E1).
  - name: questions
    description: Banco de preguntas, ciclo de revisión, citas y etiquetas.
  - name: fuentes
    description: Fuentes de conocimiento, versiones y búsqueda de pasajes (SERUMS IA, E2).
  - name: balotario
    description: Importación de balotarios (SERUMS IA, E3).
  - name: ia
    description: Consumo, cuotas y presupuesto del servicio de IA (SERUMS IA, E6).
  - name: practices
    description: Prácticas del postulante.
  - name: simulations
    description: Simulacros del postulante y su configuración.
  - name: inscripciones
    description: Procesos abiertos, inscripciones y su decisión por el admin.
  - name: testimonios
    description: Testimonios del postulante y su moderación.
  - name: notifications
    description: Notificaciones de la campana y su administración.
  - name: salud
    description: Estado operativo de los servicios para el admin.

