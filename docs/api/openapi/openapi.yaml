components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de `POST /auth/login`. Además de validar el JWT, el servidor
        exige una sesión viva en la base y lee de ella el rol y el estado en
        cada request (`auth.RequireAuth`).

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Id del recurso. Entero > 0; si no, `400`.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
    Page:
      name: page
      in: query
      required: false
      description: |
        Página, base 1. Una página más allá del final devuelve `data: []`.
        La operación dice si el parámetro es estricto o tolerante.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: |
        Elementos por página. Un valor mayor que el máximo se recorta al
        máximo. La operación dice si es estricto o tolerante y, si difieren,
        su defecto y su máximo.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Solo catálogos (`catalogs`): elementos por página, o `all` para la
        lista completa. Estricto: un valor inválido da `400`.
      schema:
        oneOf:
          - type: integer
            minimum: 1
          - type: string
            const: all

  schemas:
    ErrorCodigo:
      type: object
      description: |
        Error con código estable (README de docs/api §3). Se extiende con
        `allOf` cuando una respuesta añade campos en la raíz (por ejemplo,
        `ErrorTiempoAgotado`).
      required: [error, message]
      properties:
        error:
          type: string
          pattern: '^[a-z0-9_]+$'
          description: Código estable en `snake_case`. Es el contrato; no cambia por un cambio de texto.
          example: validacion
        message:
          type: string
          description: Texto en español para los logs del cliente. La UI traduce por código.
          example: Los datos enviados no son válidos.
        detalle:
          type: object
          description: Datos adicionales sin datos personales.
          additionalProperties: true
          example:
            campos:
              nombre: min
    ErrorTexto:
      type: object
      description: |
        Formato heredado: `error` es un texto para mostrar, no un código.
        Lo usan los middlewares y los handlers anteriores al módulo SERUMS IA.
      required: [error]
      properties:
        error:
          type: string
          example: No autenticado.
    ErrorTiempoAgotado:
      description: |
        `409 tiempo_agotado` de prácticas y simulacros: el intento venció y
        se finalizó. `resultado_id` va en la raíz, no en `detalle`.
      allOf:
        - $ref: '#/components/schemas/ErrorCodigo'
        - type: object
          required: [resultado_id]
          properties:
            error:
              const: tiempo_agotado
            resultado_id:
              type: integer
              format: int64
              minimum: 1
    PaginaMeta:
      type: object
      description: |
        Metadatos de un listado paginado. Cada listado se declara como
        `allOf: [PaginaMeta, {required: [data], properties: {data: {type: array, items: …}}}]`.
      required: [total, page, per_page]
      properties:
        total:
          type: integer
          minimum: 0
          description: Total de elementos que cumplen el filtro.
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1

  responses:
    NoAutenticado:
      description: Sin sesión, token inválido o expirado, o sesión revocada (`auth.RequireAuth`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorTexto'
          examples:
            sinSesion:
              value:
                error: 'No autenticado.'
            revocada:
              value:
                error: 'Sesión revocada.'
    AccesoDenegado:
      description: La sesión no tiene el rol `admin` (`auth.RequireAdmin`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorTexto'
          example:
            error: 'Acceso denegado.'
    ServicioNoDisponible:
      description: No se pudo comprobar la sesión por un error de la base (`auth.RequireAuth`, ADR 0005).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorTexto'
          example:
            error: 'Servicio no disponible.'
    DemasiadasSolicitudes:
      description: Rate limit por IP superado (`middleware/ratelimit.go`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorTexto'
          example:
            error: 'Demasiadas solicitudes. Intenta más tarde.'
    CuerpoDemasiadoGrande:
      description: |
        Cuerpo demasiado grande: `cuerpo_demasiado_grande` (JSON, 1 MB) o
        `archivo_demasiado_grande` (multipart en una ruta de subida). Lo
        responde el middleware global (`middleware/bodylimit.go:41-47`) o el
        handler al leer el cuerpo. Los handlers que todavía mapean el 413 con
        el formato heredado (p. ej. `auth`) documentan su propia respuesta
        con `ErrorTexto`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorCodigo'
          examples:
            cuerpo:
              value:
                error: cuerpo_demasiado_grande
                message: 'El cuerpo de la solicitud es demasiado grande.'
            archivo:
              value:
                error: archivo_demasiado_grande
                message: 'El cuerpo de la solicitud es demasiado grande.'
    ErrorInternoCodigo:
      description: Error inesperado (handlers con formato de código, `httpx.InternalErrorCode`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorCodigo'
          example:
            error: error_interno
            message: 'Error interno del servidor.'
    ErrorInternoTexto:
      description: Error inesperado (handlers con formato heredado, `httpx.InternalError`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorTexto'
          example:
            error: 'Error interno del servidor.'
