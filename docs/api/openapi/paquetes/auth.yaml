      x-rol: admin
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtra por estado exacto (`pendiente`, `activo`, `rechazado` o `inactivo`). Cualquier valor se acepta; uno desconocido da una lista vacía.
          schema:
            type: string
      responses:
        '200':
          description: 'Lista de usuarios.'
