# Paquete internal/auth (backend-dev-2). Rutas: backend/internal/auth/routes.go.
# Contratos de diseño: docs/api/auth-idioma-correos.md y docs/api/plataforma-avisos-idioma.md.
# Los handlers de este paquete usan el formato de error heredado (`ErrorTexto`), salvo
# PUT /auth/idioma (`ErrorCodigo`). El cuerpo se decodifica con `decodeJSON`: exige
# `Content-Type: application/json` (415).
paths:
  /auth/check-dni:
    get:
      operationId: auth.CheckDNI
      tags: [auth]
      summary: 'Consultar un DNI para el registro'
      description: |
        Público, con rate limit (20 solicitudes por minuto por IP) y límites persistidos por DNI e IP.

        Devuelve datos enmascarados de la persona precargada para ayudar a completar
        el registro. Un DNI inexistente y uno que ya tiene cuenta responden igual
        (`404`), para no revelar qué personas existen.
      x-rol: publico
      security: []
      parameters:
        - name: dni
          in: query
          required: true
          description: DNI de 8 dígitos.
          schema:
            type: string
            pattern: '^[0-9]{8}$'
          example: '00000000'
      responses:
        '200':
          description: 'La persona existe y aún no tiene cuenta.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/CheckDniResultado'
              example:
                nombres: Persona
                apellido_paterno: Ejemplo
                email_masked: p****@example.com
        '400':
          description: 'El DNI no tiene exactamente 8 dígitos.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El DNI debe tener exactamente 8 dígitos.'
        '404':
          description: 'DNI no encontrado o no disponible para registro (también si ya tiene cuenta).'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'DNI no encontrado o no disponible para registro.'
        '429':
          description: 'Rate limit por IP, o demasiadas consultas del mismo DNI o desde la misma IP.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Demasiadas consultas de DNI. Intenta más tarde.'
        '500':
          $ref: '../openapi.yaml#/components/responses/ErrorInternoTexto'

  /auth/check-username:
    get:
      operationId: auth.CheckUsername
      tags: [auth]
      summary: 'Comprobar si un usuario está disponible'
      description: |
        Público, con rate limit (20 solicitudes por minuto por IP).
      x-rol: publico
      security: []
      parameters:
        - name: username
          in: query
          required: true
          description: Usuario a comprobar, de 4 a 30 caracteres.
          schema:
            type: string
            minLength: 4
            maxLength: 30
          example: personaejemplo
      responses:
        '200':
          description: 'Resultado de la comprobación.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/UsuarioDisponible'
              example:
                available: true
        '400':
          description: 'El usuario tiene menos de 4 o más de 30 caracteres.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Username inválido.'
        '429':
          $ref: '../openapi.yaml#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '../openapi.yaml#/components/responses/ErrorInternoTexto'

  /auth/register:
    post:
      operationId: auth.Register
      tags: [auth]
      summary: 'Solicitar el registro de una persona'
      description: |
        Público, con rate limit (10 solicitudes por minuto por IP) y límites de intentos
        por DNI (5 en 15 minutos por DNI e IP y 30 en una hora por DNI).

        Solo identifica a la persona precargada: las credenciales se eligen al abrir el
        enlace del correo (`POST /auth/verify-email`). **Todo resultado de negocio
        responde `202` con el mismo mensaje**, y tarda al menos 400 ms: DNI inexistente,
        DNI ya registrado, correo distinto del que consta, correo ya usado o éxito.
        Así el endpoint no sirve para averiguar nada. Solo los errores de forma (`422`),
        el rate limit (`429`) y los fallos internos (`500`) se distinguen.

        `locale` (`es` o `en`) solo decide el idioma del correo de verificación; un valor
        ausente o desconocido cae a `es`. No cambia el idioma guardado del usuario.
      x-rol: publico
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/RegisterRequest'
            example:
              dni: '00000000'
              email: persona@example.com
              locale: es
      responses:
        '202':
          description: 'Solicitud aceptada (con o sin correo enviado).'
          content:
            application/json:
              schema:
                $ref: '#/schemas/Mensaje'
              example:
                message: 'Si los datos son correctos, te enviamos un correo para confirmar tu registro.'
        '400':
          description: 'JSON mal formado.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Cuerpo de solicitud inválido.'
        '413':
          $ref: '../openapi.yaml#/components/responses/CuerpoDemasiadoGrande'
        '415':
          description: 'El cuerpo no declara `Content-Type: application/json`.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El cuerpo de la solicitud debe ser JSON (Content-Type: application/json).'
        '422':
          description: 'Datos inválidos (DNI de 8 dígitos o correo inválido).'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El DNI debe tener exactamente 8 dígitos.'
        '429':
          description: 'Rate limit por IP o demasiados intentos para este DNI.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Demasiados intentos de registro fallidos. Intenta más tarde.'
        '500':
          $ref: '../openapi.yaml#/components/responses/ErrorInternoTexto'

  /auth/verify-email:
    post:
      operationId: auth.VerifyEmail
      tags: [auth]
      summary: 'Verificar el correo y crear el usuario'
      description: |
        Público, con rate limit (10 por minuto por IP) y 10 intentos por hora por enlace.

        Consume el token del correo de `POST /auth/register`, crea el usuario en estado
        `pendiente` (lo activa un admin) y fija su idioma con `locale`: `es` o `en`
        (ausente o desconocido cae a `es`). Encola el correo «Solicitud de cuenta recibida».
      x-rol: publico
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/VerifyEmailRequest'
            example:
              token: abc123
              username: personaejemplo
              password: ClaveEjemplo123
              confirm_password: ClaveEjemplo123
              locale: en
      responses:
        '201':
          description: 'Usuario creado, pendiente de activación.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/Mensaje'
              example:
                message: 'Registro exitoso. Tu cuenta está pendiente de activación.'
        '400':
          description: 'Token inválido, usado o vencido; o JSON mal formado.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El enlace de verificación es inválido o ha expirado.'
        '409':
          description: 'El usuario ya está en uso (`El nombre de usuario ya está en uso. Elige otro.`) o el correo pasó a otra persona (`El correo ya está asociado a otra persona. Contacta al administrador.`).'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El nombre de usuario ya está en uso. Elige otro.'
        '413':
          $ref: '../openapi.yaml#/components/responses/CuerpoDemasiadoGrande'
        '415':
          description: 'El cuerpo no declara `Content-Type: application/json`.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El cuerpo de la solicitud debe ser JSON (Content-Type: application/json).'
        '422':
          description: 'Datos inválidos (usuario de 4 a 30 caracteres alfanuméricos, contraseña de 8 caracteres y como máximo 72 bytes, confirmación igual).'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Las contraseñas no coinciden.'
        '429':
          description: 'Rate limit por IP o 10 intentos con este enlace.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Demasiados intentos con este enlace. Intenta más tarde.'
        '500':
          $ref: '../openapi.yaml#/components/responses/ErrorInternoTexto'

  /auth/login:
    post:
      operationId: auth.Login
      tags: [auth]
      summary: 'Iniciar sesión'
      description: |
        Público, con rate limit (10 por minuto por IP). Tras 5 intentos fallidos la
        cuenta se bloquea 15 minutos (`429`).

        Devuelve el JWT y el perfil del usuario (con su `idioma` guardado). Solo entran
        las cuentas en estado `activo`. Si la base no responde, `503` (ADR 0005): no es
        un `401`, para no confundir una caída con credenciales erróneas.
      x-rol: publico
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/LoginRequest'
            example:
              username: personaejemplo
              password: ClaveEjemplo123
      responses:
        '200':
          description: 'Sesión iniciada.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiJ9.ejemplo.firma
                expires_at: 1767225600
                user:
                  id: 1
                  username: personaejemplo
                  nombres: Persona
                  apellido_paterno: Ejemplo
                  apellido_materno: Muestra
                  rol: usuario
                  estado: activo
                  grado_id: 1
                  grado: Grado Ejemplo
                  nivel: suboficial
                  especialidad: Especialidad Ejemplo
                  institucion: Institución Ejemplo
                  tour_completado: false
                  idioma: es
        '400':
          description: 'JSON mal formado.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Cuerpo de solicitud inválido.'
        '401':
          description: 'Usuario o contraseña incorrectos.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Credenciales inválidas.'
        '403':
          description: 'Cuenta pendiente, rechazada o desactivada.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Tu cuenta está pendiente de activación por el administrador.'
        '413':
          $ref: '../openapi.yaml#/components/responses/CuerpoDemasiadoGrande'
        '415':
          description: 'El cuerpo no declara `Content-Type: application/json`.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El cuerpo de la solicitud debe ser JSON (Content-Type: application/json).'
        '422':
          description: 'Falta el usuario o la contraseña.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Datos inválidos. Revisa los campos del formulario.'
        '429':
          description: 'Cuenta bloqueada tras 5 intentos fallidos, o rate limit por IP.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Demasiados intentos fallidos. Cuenta bloqueada temporalmente. Intente en 15 minutos.'
        '500':
          $ref: '../openapi.yaml#/components/responses/ErrorInternoTexto'
        '503':
          description: 'La base de datos no responde (login no disponible).'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Servicio no disponible.'

  /auth/forgot-password:
    post:
      operationId: auth.ForgotPassword
      tags: [auth]
      summary: 'Pedir el enlace para restablecer la contraseña'
      description: |
        Público, con rate limit (10 por minuto por IP). Responde siempre `200` con el
        mismo mensaje, exista o no el correo. `locale` (`es` o `en`) elige el idioma del
        correo; ausente o desconocido cae a `es`. No cambia el idioma guardado.
      x-rol: publico
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/ForgotPasswordRequest'
            example:
              email: persona@example.com
              locale: es
      responses:
        '200':
          description: 'Solicitud recibida.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/Mensaje'
              example:
                message: 'Si el email está registrado, recibirás un enlace para restablecer tu contraseña.'
        '400':
          description: 'JSON mal formado.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Cuerpo de solicitud inválido.'
        '413':
          $ref: '../openapi.yaml#/components/responses/CuerpoDemasiadoGrande'
        '415':
          description: 'El cuerpo no declara `Content-Type: application/json`.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El cuerpo de la solicitud debe ser JSON (Content-Type: application/json).'
        '422':
          description: 'Correo inválido.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Ingresa un correo electrónico válido.'
        '429':
          $ref: '../openapi.yaml#/components/responses/DemasiadasSolicitudes'

  /auth/reset-password:
    post:
      operationId: auth.ResetPassword
      tags: [auth]
      summary: 'Restablecer la contraseña con el token del correo'
      description: |
        Público, con rate limit (10 por minuto por IP). Cambia la contraseña, revoca las
        sesiones del usuario y envía el aviso «Contraseña restablecida» en el idioma de
        `locale` (`es` o `en`; ausente o desconocido cae a `es`).
      x-rol: publico
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/ResetPasswordRequest'
            example:
              token: abc123
              password: ClaveNueva123
              confirm_password: ClaveNueva123
              locale: es
      responses:
        '200':
          description: 'Contraseña restablecida.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/Mensaje'
              example:
                message: 'Contraseña restablecida exitosamente.'
        '400':
          description: 'Token inválido, usado o vencido; o JSON mal formado.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El enlace de recuperación es inválido o ha expirado.'
        '413':
          $ref: '../openapi.yaml#/components/responses/CuerpoDemasiadoGrande'
        '415':
          description: 'El cuerpo no declara `Content-Type: application/json`.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El cuerpo de la solicitud debe ser JSON (Content-Type: application/json).'
        '422':
          description: 'Datos inválidos (contraseña de 8 caracteres y como máximo 72 bytes, confirmación igual).'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Las contraseñas no coinciden.'
        '429':
          $ref: '../openapi.yaml#/components/responses/DemasiadasSolicitudes'
        '500':
          $ref: '../openapi.yaml#/components/responses/ErrorInternoTexto'

  /auth/logout:
    post:
      operationId: auth.Logout
      tags: [auth]
      summary: 'Cerrar la sesión actual'
      description: |
        Autenticado (cualquier rol). Invalida el token de la petición y registra el cierre. Siempre `200`.
      x-rol: autenticado
      responses:
        '200':
          description: 'Sesión cerrada.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/Mensaje'
              example:
                message: 'Sesión cerrada.'
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
        '503':
          $ref: '../openapi.yaml#/components/responses/ServicioNoDisponible'

  /auth/me:
    get:
      operationId: auth.Me
      tags: [auth]
      summary: 'Perfil del usuario con sesión'
      description: |
        Autenticado (cualquier rol). Incluye el `idioma` guardado (`es` o `en`).
      x-rol: autenticado
      responses:
        '200':
          description: 'Perfil del usuario.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/UserProfile'
              example:
                id: 1
                username: personaejemplo
                nombres: Persona
                apellido_paterno: Ejemplo
                apellido_materno: Muestra
                rol: usuario
                estado: activo
                grado_id: 1
                grado: Grado Ejemplo
                nivel: suboficial
                especialidad: Especialidad Ejemplo
                institucion: Institución Ejemplo
                tour_completado: false
                idioma: es
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
        '500':
          $ref: '../openapi.yaml#/components/responses/ErrorInternoTexto'
        '503':
          $ref: '../openapi.yaml#/components/responses/ServicioNoDisponible'

  /auth/idioma:
    put:
      operationId: auth.SetIdioma
      tags: [auth]
      summary: 'Guardar el idioma del usuario'
      description: |
        Autenticado (cualquier rol). Guarda el idioma de la **propia** cuenta (el usuario
        sale de la sesión: no hay id en la ruta ni en el cuerpo). Idempotente y sin
        auditoría, porque es una preferencia personal. Contrato de diseño:
        `docs/api/plataforma-avisos-idioma.md` §1.3.

        El valor debe ser exactamente `es` o `en` (no se normaliza). El cuerpo se lee de
        forma estricta: un campo desconocido es `400`.
      x-rol: autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/IdiomaSolicitud'
            example:
              idioma: en
      responses:
        '200':
          description: 'Idioma guardado.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/IdiomaRespuesta'
              example:
                idioma: en
        '400':
          description: 'JSON mal formado, campo desconocido o `idioma` que no es texto.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorCodigo'
              example:
                error: cuerpo_invalido
                message: 'Cuerpo de solicitud inválido.'
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
        '413':
          $ref: '../openapi.yaml#/components/responses/CuerpoDemasiadoGrande'
        '422':
          description: '`idioma` no es exactamente `es` ni `en` (códigos: `idioma_invalido`). El valor guardado no cambia.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorCodigo'
              example:
                error: idioma_invalido
                message: 'Idioma no soportado.'
        '500':
          $ref: '../openapi.yaml#/components/responses/ErrorInternoCodigo'
        '503':
          $ref: '../openapi.yaml#/components/responses/ServicioNoDisponible'

  /auth/tour/completar:
    post:
      operationId: auth.CompleteTour
      tags: [auth]
      summary: 'Marcar el tour como completado'
      description: |
        Autenticado (cualquier rol). Marca `tour_completado = true` en la propia cuenta.
      x-rol: autenticado
      responses:
        '200':
          description: 'Tour marcado.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/TourEstado'
              example:
                tour_completado: true
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
        '500':
          description: 'Error al guardar.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Error interno.'
        '503':
          $ref: '../openapi.yaml#/components/responses/ServicioNoDisponible'
    delete:
      operationId: auth.ResetTour
      tags: [auth]
      summary: 'Reiniciar el tour del propio usuario'
      description: |
        Autenticado (cualquier rol). Marca `tour_completado = false` en la propia cuenta para volver a ver el tour.
      x-rol: autenticado
      responses:
        '200':
          description: 'Tour reiniciado.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/TourEstado'
              example:
                tour_completado: false
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
        '500':
          description: 'Error al guardar.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Error interno.'
        '503':
          $ref: '../openapi.yaml#/components/responses/ServicioNoDisponible'

  /admin/personas:
    get:
      operationId: auth.ListPersonas
      tags: [auth]
      summary: 'Listar las personas precargadas'
      description: |
        Solo admin. Sin paginación ni filtros: devuelve todas las personas, con sus datos
        personales descifrados (DNI, correo y teléfono).
      x-rol: admin
      responses:
        '200':
          description: 'Lista completa de personas.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/PersonaListado'
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../openapi.yaml#/components/responses/AccesoDenegado'
        '500':
          $ref: '../openapi.yaml#/components/responses/ErrorInternoTexto'
        '503':
          $ref: '../openapi.yaml#/components/responses/ServicioNoDisponible'

  /admin/personas/{id}:
    get:
      operationId: auth.GetPersona
      tags: [auth]
      summary: 'Detalle de una persona'
      description: |
        Solo admin. Un `id` no numérico es `400`; cualquier fallo de lectura (incluido el id inexistente) es `404`.
      x-rol: admin
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/Id'
      responses:
        '200':
          description: 'La persona.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/PersonaListado'
        '400':
          description: 'Id no numérico.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'ID de persona inválido.'
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../openapi.yaml#/components/responses/AccesoDenegado'
