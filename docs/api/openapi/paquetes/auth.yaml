                message: 'Correo actualizado correctamente.'
        '400':
          description: 'Id no numérico o JSON mal formado.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'ID de usuario inválido.'
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
