  /admin/usuarios/{id}/estado:
    patch:
      operationId: auth.UpdateEstado
      tags: [auth]
      summary: 'Cambiar el estado de un usuario'
      description: |
        Solo admin. Activa, rechaza o desactiva una cuenta, audita el cambio con la IP del
        admin y revoca las sesiones del usuario si pasa a `rechazado` o `inactivo`.
        Envía al usuario un correo en **su** idioma guardado (`usuarios.idioma`), no en el del admin.

        Un admin no puede desactivar ni rechazar su propia cuenta, ni se puede quitar al último admin activo (`409`).
      x-rol: admin
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/EstadoUsuarioSolicitud'
            example:
              estado: activo
              observacion: Datos verificados.
      responses:
        '200':
          description: 'Estado actualizado.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/EstadoUsuarioRespuesta'
              example:
                id: 2
                estado: activo
                updated_at: '2026-11-15T09:30:00Z'
        '400':
          description: 'Id no numérico o JSON mal formado.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'ID de usuario inválido.'
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../openapi.yaml#/components/responses/AccesoDenegado'
        '404':
          description: 'No existe el usuario.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Usuario no encontrado.'
        '409':
          description: 'El admin cambia su propio estado o se quitaría al último admin activo.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'No puedes desactivar ni rechazar tu propia cuenta.'
        '413':
          $ref: '../openapi.yaml#/components/responses/CuerpoDemasiadoGrande'
        '415':
          description: 'El cuerpo no declara `Content-Type: application/json`.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El cuerpo de la solicitud debe ser JSON (Content-Type: application/json).'
        '422':
          description: 'Estado fuera de `activo`, `rechazado`, `inactivo`, u observación de más de 500 caracteres.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El estado no es válido.'
        '500':
          $ref: '../openapi.yaml#/components/responses/ErrorInternoTexto'
        '503':
          $ref: '../openapi.yaml#/components/responses/ServicioNoDisponible'

  /admin/usuarios/{id}/email:
