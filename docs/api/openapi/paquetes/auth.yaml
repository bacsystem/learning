        '404':
          description: 'No existe el usuario.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Usuario no encontrado.'
        '409':
          description: 'El correo ya es de otra persona.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El correo ya está asociado a otra persona.'
        '413':
