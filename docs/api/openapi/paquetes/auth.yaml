              $ref: '#/schemas/ConfigSesiones'
            example:
              max_sesiones: 3
      responses:
        '200':
          description: 'Configuración guardada.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/ConfigSesiones'
              example:
                max_sesiones: 3
        '400':
          description: 'JSON mal formado.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Cuerpo de solicitud inválido.'
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../openapi.yaml#/components/responses/AccesoDenegado'
        '413':
          $ref: '../openapi.yaml#/components/responses/CuerpoDemasiadoGrande'
        '415':
          description: 'El cuerpo no declara `Content-Type: application/json`.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El cuerpo de la solicitud debe ser JSON (Content-Type: application/json).'
        '422':
          description: 'Fuera de 1 a 10 o ausente.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'max_sesiones debe ser entre 1 y 10.'
        '500':
          $ref: '../openapi.yaml#/components/responses/ErrorInternoTexto'
        '503':
          $ref: '../openapi.yaml#/components/responses/ServicioNoDisponible'

  /admin/config/recursos:
    get:
      operationId: auth.GetConfigRecursos
      tags: [auth]
      summary: 'Accesos directos del header'
      description: |
        **Cualquier sesión** (no solo admin): el header de todos los usuarios los muestra.
        Si el valor guardado está dañado, devuelve una lista vacía.
      x-rol: autenticado
      responses:
        '200':
          description: 'Lista de accesos directos.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/Recurso'
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
        '500':
          $ref: '../openapi.yaml#/components/responses/ErrorInternoTexto'
        '503':
          $ref: '../openapi.yaml#/components/responses/ServicioNoDisponible'
    put:
      operationId: auth.SetConfigRecursos
      tags: [auth]
      summary: 'Reemplazar los accesos directos del header'
      description: |
        Solo admin. Reemplaza la lista completa (puede ser vacía) y devuelve la lista guardada. Se audita.
      x-rol: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/RecursosSolicitud'
            example:
              recursos:
                - id: guia
                  titulo: Guía de estudio
                  descripcion: Material de apoyo
                  url: https://example.com/guia
                  icono: book
                  orden: 1
                  activo: true
      responses:
        '200':
          description: 'Lista guardada.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/Recurso'
        '400':
          description: 'JSON mal formado.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Cuerpo de solicitud inválido.'
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../openapi.yaml#/components/responses/AccesoDenegado'
        '413':
          $ref: '../openapi.yaml#/components/responses/CuerpoDemasiadoGrande'
        '415':
          description: 'El cuerpo no declara `Content-Type: application/json`.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'El cuerpo de la solicitud debe ser JSON (Content-Type: application/json).'
        '422':
          description: 'Un recurso sin título o con URL inválida.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Datos inválidos: revise el título y la URL de cada recurso.'
        '500':
          $ref: '../openapi.yaml#/components/responses/ErrorInternoTexto'
        '503':
          $ref: '../openapi.yaml#/components/responses/ServicioNoDisponible'

schemas:
  Mensaje:
    type: object
    required: [message]
    properties:
      message:
        type: string
  TourEstado:
    type: object
    required: [tour_completado]
    properties:
      tour_completado:
        type: boolean
  CheckDniResultado:
    type: object
    description: Datos enmascarados de la persona precargada.
    required: [nombres, apellido_paterno, email_masked]
    properties:
      nombres:
        type: string
      apellido_paterno:
        type: string
      email_masked:
        type: string
        description: Correo con la parte local oculta.
  UsuarioDisponible:
    type: object
    required: [available]
    properties:
      available:
        type: boolean
  RegisterRequest:
    type: object
    required: [dni, email]
    properties:
      dni:
        type: string
        pattern: '^[0-9]{8}$'
      email:
        type: string
        format: email
        maxLength: 254
      locale:
        type: string
        description: |
          Opcional. Idioma del correo: `es` o `en` (se recortan espacios y se
          ignoran mayúsculas). Ausente o cualquier otro valor cae a `es`; nunca
          da error.
  VerifyEmailRequest:
    type: object
    required: [token, username, password, confirm_password]
    properties:
      token:
        type: string
        maxLength: 128
      username:
        type: string
        minLength: 4
        maxLength: 30
        pattern: '^[A-Za-z0-9]+$'
      password:
        type: string
        minLength: 8
        description: Como máximo 72 **bytes** (límite de bcrypt).
      confirm_password:
        type: string
        description: Igual a `password`.
      locale:
        type: string
        description: |
          Opcional. Idioma guardado del usuario que se crea: `es` o `en`
          (ausente o desconocido cae a `es`). Es el idioma de la interfaz al
          terminar el registro (PLT-11).
  LoginRequest:
    type: object
    required: [username, password]
    properties:
      username:
        type: string
      password:
        type: string
  UserProfile:
    type: object
    required: [id, username, nombres, apellido_paterno, apellido_materno, rol, estado, grado_id, grado, nivel, especialidad, institucion, tour_completado, idioma]
    properties:
      id:
        type: integer
        format: int64
      username:
        type: string
      nombres:
        type: string
      apellido_paterno:
        type: string
      apellido_materno:
        type: string
      rol:
        type: string
        enum: [usuario, admin]
      estado:
        type: string
        enum: [pendiente, activo, rechazado, inactivo]
      grado_id:
        type: integer
        format: int64
      grado:
        type: string
      nivel:
        type: string
      especialidad:
        type: string
      institucion:
        type: string
      tour_completado:
        type: boolean
      idioma:
        type: string
        enum: [es, en]
        description: Idioma guardado del usuario (PLT-11).
  LoginResponse:
    type: object
    required: [token, expires_at, user]
    properties:
      token:
        type: string
        description: JWT; se envía como `Authorization Bearer`.
      expires_at:
        type: integer
        format: int64
        description: Expiración, en segundos Unix.
      user:
        $ref: '#/schemas/UserProfile'
  ForgotPasswordRequest:
    type: object
    required: [email]
    properties:
      email:
        type: string
        format: email
      locale:
        type: string
        description: Opcional. Idioma del correo (`es` o `en`; otro valor cae a `es`).
  ResetPasswordRequest:
    type: object
    required: [token, password, confirm_password]
    properties:
      token:
        type: string
      password:
        type: string
        minLength: 8
        description: Como máximo 72 **bytes** (límite de bcrypt).
      confirm_password:
        type: string
      locale:
        type: string
        description: Opcional. Idioma del aviso (`es` o `en`; otro valor cae a `es`).
  IdiomaSolicitud:
    type: object
    required: [idioma]
    properties:
      idioma:
        type: string
        enum: [es, en]
        description: Exactamente `es` o `en`.
  IdiomaRespuesta:
    type: object
    required: [idioma]
    properties:
      idioma:
        type: string
        enum: [es, en]
  PersonaListado:
    type: object
    description: Persona precargada, con datos personales descifrados.
    required: [id, dni, nombre_completo, nombres, apellido_paterno, apellido_materno, email, telefono, grado_id, grado, especialidad_id, especialidad, institucion_id, institucion, estado, tiene_usuario]
    properties:
      id:
        type: integer
        format: int64
      dni:
        type: string
      nombre_completo:
        type: string
      nombres:
        type: string
      apellido_paterno:
        type: string
      apellido_materno:
        type: string
      email:
        type: string
      telefono:
        type: string
      grado_id:
        type: integer
        format: int64
      grado:
        type: string
      especialidad_id:
        type: integer
        format: int64
      especialidad:
        type: string
      institucion_id:
        type: integer
        format: int64
      institucion:
        type: string
      estado:
        type: string
        enum: [activo, inactivo]
      tiene_usuario:
        type: boolean
  PersonaEdicion:
    type: object
    required: [nombres, apellido_paterno, email, grado_id, especialidad_id, institucion_id, estado]
    properties:
      nombres:
        type: string
        minLength: 2
        maxLength: 100
      apellido_paterno:
        type: string
        minLength: 2
        maxLength: 100
      apellido_materno:
        type: string
        maxLength: 100
      email:
        type: string
        format: email
      telefono:
        type: string
        maxLength: 20
      grado_id:
        type: integer
        format: int64
      especialidad_id:
        type: integer
        format: int64
      institucion_id:
        type: integer
        format: int64
      estado:
        type: string
        enum: [activo, inactivo]
  UsuarioListado:
    type: object
    required: [id, username, nombre_completo, dni, email, grado, especialidad, estado, fecha_solicitud]
    properties:
      id:
        type: integer
        format: int64
      username:
        type: string
      nombre_completo:
        type: string
      dni:
        type: string
        description: Enmascarado, solo los últimos 4 dígitos (`****1234`).
      email:
        type: string
      grado:
        type: string
      especialidad:
        type: string
      estado:
        type: string
        enum: [pendiente, activo, rechazado, inactivo]
      fecha_solicitud:
        type: string
        format: date
        description: Fecha de creación del usuario (`AAAA-MM-DD`).
  EstadoUsuarioSolicitud:
    type: object
    required: [estado]
    properties:
      estado:
        type: string
        enum: [activo, rechazado, inactivo]
      observacion:
        type: string
        maxLength: 500
  EstadoUsuarioRespuesta:
    type: object
    required: [id, estado, updated_at]
    properties:
      id:
        type: integer
        format: int64
      estado:
        type: string
        enum: [activo, rechazado, inactivo]
      updated_at:
        type: string
        description: |
          RFC 3339 (con fracción de segundo). Va vacía si la lectura posterior
          a la actualización falla; el cambio ya está guardado.
  EmailSolicitud:
    type: object
    required: [email]
    properties:
      email:
        type: string
        format: email
  ResetLimitesSolicitud:
    type: object
    required: [dni]
    properties:
      dni:
        type: string
        pattern: '^[0-9]{8}$'
  LoteSolicitud:
    type: object
    required: [personas]
    properties:
      personas:
        type: array
        items:
          type: object
          required: [dni, nombres, apellido_paterno, apellido_materno, grado_id, especialidad_id, institucion_id, telefono, email]
          properties:
            dni:
              type: string
              pattern: '^[0-9]{8}$'
            nombres:
              type: string
              minLength: 2
              maxLength: 100
            apellido_paterno:
              type: string
              minLength: 2
              maxLength: 100
            apellido_materno:
              type: string
              minLength: 2
              maxLength: 100
            grado_id:
              type: integer
              format: int64
            especialidad_id:
              type: integer
              format: int64
            institucion_id:
              type: integer
              format: int64
            telefono:
              type: string
              minLength: 9
              maxLength: 15
            email:
              type: string
              format: email
  LoteRespuesta:
    type: object
    required: [inserted, duplicates]
    properties:
      inserted:
        type: integer
        minimum: 0
      duplicates:
        type: integer
        minimum: 0
      errors:
        type: array
        description: Errores por fila o por DNI. Se omite cuando no hay.
        items:
          type: string
  VistaPreviaPersonas:
    type: object
    required: [rows, total_valido, total_error]
    properties:
      rows:
        type: array
        items:
          type: object
          required: [row, dni, nombres, apellido_paterno, apellido_materno, grado_id, especialidad_id, institucion_id, telefono, email, estado]
          properties:
            row:
              type: integer
              description: Número de fila en el archivo (la cabecera es la 1).
            dni:
              type: string
            nombres:
              type: string
            apellido_paterno:
              type: string
            apellido_materno:
              type: string
            grado_id:
              type: integer
              format: int64
            especialidad_id:
              type: integer
              format: int64
            institucion_id:
              type: integer
              format: int64
            telefono:
              type: string
            email:
              type: string
            estado:
              type: string
              enum: [valido, error]
            error:
              type: string
              description: Motivo, solo si `estado = error`.
      total_valido:
        type: integer
        minimum: 0
      total_error:
        type: integer
        minimum: 0
  ConfigSesiones:
    type: object
    required: [max_sesiones]
    properties:
      max_sesiones:
        type: integer
        minimum: 1
        maximum: 10
  Recurso:
    type: object
    description: Acceso directo configurable del header.
    required: [id, titulo, url]
    properties:
      id:
        type: string
      titulo:
        type: string
        maxLength: 120
      descripcion:
        type: string
        maxLength: 240
      url:
        type: string
        format: uri
        description: Solo `http` o `https`.
      icono:
        type: string
        maxLength: 60
      orden:
        type: integer
      activo:
        type: boolean
  RecursosSolicitud:
    type: object
    required: [recursos]
    properties:
      recursos:
        type: array
        items:
          $ref: '#/schemas/Recurso'
  UsuariosOnline:
    type: object
    required: [data, total]
    properties:
      data:
        type: array
        items:
          type: object
          required: [id, username, nombre_completo, rol, ip, last_seen_at]
          properties:
            id:
              type: integer
              format: int64
            username:
              type: string
            nombre_completo:
              type: string
            rol:
              type: string
              enum: [usuario, admin]
            ip:
              type: string
            last_seen_at:
              type: string
              format: date-time
      total:
        type: integer
        minimum: 0
  SesionesUsuario:
    type: object
    required: [data, total]
    properties:
      data:
        type: array
        items:
          type: object
          required: [ip, user_agent, created_at, last_seen_at, expires_at, activa]
          properties:
            ip:
              type: string
            user_agent:
              type: string
            created_at:
              type: string
              format: date-time
            last_seen_at:
              type: string
              format: date-time
            expires_at:
              type: string
              format: date-time
            activa:
              type: boolean
      total:
        type: integer
        minimum: 0
