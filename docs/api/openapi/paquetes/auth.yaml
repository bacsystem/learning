  /admin/personas/preview:
    post:
      operationId: auth.PreviewPersonasCSV
      tags: [auth]
      summary: 'Vista previa de una importación de personas'
      description: |
        Solo admin. Multipart con el campo `file`: CSV o XLSX (se reconoce por la extensión
        `.xlsx` o por el `Content-Type`; cualquier otro caso se lee como CSV). La primera
        fila es la cabecera. Columnas, en este orden: `dni`, `nombres`, `apellido_paterno`,
        `apellido_materno`, `grado_id`, `especialidad_id`, `institucion_id`, `telefono`, `email`.
        Máximo 1000 filas. El handler limita el cuerpo a 10 MB y el middleware global a 20 MB
        (`archivo_demasiado_grande`, 413); un cuerpo mayor de 10 MB que llega al handler da `400`.

        No escribe nada: valida cada fila y devuelve su estado.
      x-rol: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo CSV o XLSX.
      responses:
        '200':
          description: 'Filas leídas con su validación.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/VistaPreviaPersonas'
              example:
                rows:
                  - row: 2
                    dni: '00000000'
                    nombres: Persona
                    apellido_paterno: Ejemplo
                    apellido_materno: Muestra
                    grado_id: 1
                    especialidad_id: 1
                    institucion_id: 1
                    telefono: '900000000'
                    email: persona@example.com
                    estado: valido
                total_valido: 1
                total_error: 0
        '400':
          description: 'Formulario ilegible, cuerpo de más de 10 MB o falta el campo `file`.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Archivo requerido (campo ''file'').'
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../openapi.yaml#/components/responses/AccesoDenegado'
        '413':
          $ref: '../openapi.yaml#/components/responses/CuerpoDemasiadoGrande'
        '422':
          description: 'Archivo ilegible o con más de 1000 filas.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'el archivo excede el máximo de 1000 filas'
        '503':
          $ref: '../openapi.yaml#/components/responses/ServicioNoDisponible'

  /admin/personas/import:
    post:
      operationId: auth.ImportPersonasCSV
      tags: [auth]
      summary: 'Importar personas desde CSV o XLSX'
      description: |
        Solo admin. Multipart con el campo `file`: CSV o XLSX (se reconoce por la extensión
        `.xlsx` o por el `Content-Type`; cualquier otro caso se lee como CSV). La primera
        fila es la cabecera. Columnas, en este orden: `dni`, `nombres`, `apellido_paterno`,
        `apellido_materno`, `grado_id`, `especialidad_id`, `institucion_id`, `telefono`, `email`.
        Máximo 1000 filas. El handler limita el cuerpo a 10 MB y el middleware global a 20 MB
        (`archivo_demasiado_grande`, 413); un cuerpo mayor de 10 MB que llega al handler da `400`.

        Importa las filas válidas; las inválidas van en `errors` con el prefijo `fila N:` (N cuenta la cabecera como fila 1).
      x-rol: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo CSV o XLSX.
      responses:
        '200':
          description: 'Resultado de la importación.'
          content:
            application/json:
              schema:
                $ref: '#/schemas/LoteRespuesta'
              example:
                inserted: 1
                duplicates: 0
                errors:
                  - 'fila 3: email inválido'
        '400':
          description: 'Formulario ilegible, cuerpo de más de 10 MB o falta el campo `file`.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Archivo requerido (campo ''file'').'
        '401':
          $ref: '../openapi.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../openapi.yaml#/components/responses/AccesoDenegado'
        '413':
          $ref: '../openapi.yaml#/components/responses/CuerpoDemasiadoGrande'
        '422':
          description: 'Archivo ilegible o con más de 1000 filas.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'el archivo excede el máximo de 1000 filas'
        '500':
          description: 'Error al importar.'
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/ErrorTexto'
              example:
                error: 'Error al importar personas.'
        '503':
          $ref: '../openapi.yaml#/components/responses/ServicioNoDisponible'

