# Paquete balotario (backend-dev). Rutas: backend/internal/balotario/routes.go:12-23 (constantes).
# Contrato de apoyo: serums-ia-e3-01-e3-03-balotario.md §3-4. Todo el paquete responde con el formato de código.
paths:
  "/admin/fuentes/{id}/balotario":
    get:
      operationId: balotario.VistaPrevia
      tags: [balotario]
      summary: "Vista previa de un balotario"
      description: "Solo `admin`. Analiza la versión vigente de una fuente de tipo `balotario` y devuelve totales, una muestra de preguntas válidas y los bloques con problemas. No guarda nada."
      x-rol: admin
      parameters:
        - "$ref": "../openapi.yaml#/components/parameters/Id"
        - name: page
          in: query
          required: false
          description: "Página de problemas, base 1. **Estricto**."
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: per_page
          in: query
          required: false
          description: "Problemas por página. **Estricto** para no numéricos o ≤ 0; uno mayor que 100 se recorta."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Vista previa."
          content:
            application/json:
              schema:
                "$ref": "#/schemas/VistaPreviaBalotario"
              example:
                fuente:
                  id: 5
                  titulo: "Balotario de ejemplo"
                  version: 1
                  oficial_verificada: false
                  oficial_entidad: null
                ruta_revision: estructural
                totales:
                  validas: 1
                  con_problemas: 1
                  unica: 1
                  multiple: 0
                  con_alertas: 0
                preguntas:
                  - numero: 1
                    linea_inicio: 3
                    linea_fin: 8
                    tipo: unica
                    enunciado: "¿Pregunta de ejemplo?"
                    alternativas:
                      - letra: a
                        texto: "Opción A"
                        correcta: true
                      - letra: b
                        texto: "Opción B"
                        correcta: false
                    alertas_estructura: []
                problemas:
                  data:
                    - numero: 2
                      linea_inicio: 10
                      linea_fin: 12
                      motivos: [sin_clave]
                  total: 1
                  page: 1
                  per_page: 20
                importacion: null
                otras_importaciones: []
                puede_confirmar: true
                motivo_no_confirmable: null
        "400":
          description: "`parametro_invalido`: `{id}`, `page` o `per_page` inválidos."
          content:
            application/json:
              schema:
                "$ref": "../openapi.yaml#/components/schemas/ErrorCodigo"
              example:
                error: parametro_invalido
                message: "Parámetro inválido."
        "401":
          "$ref": "../openapi.yaml#/components/responses/NoAutenticado"
        "403":
          "$ref": "../openapi.yaml#/components/responses/AccesoDenegado"
        "404":
          description: "`no_encontrado`: la fuente no existe."
          content:
            application/json:
              schema:
                "$ref": "../openapi.yaml#/components/schemas/ErrorCodigo"
              example:
                error: no_encontrado
                message: "Registro no encontrado."
        "422":
          description: "`tipo_fuente_invalido` (no es un balotario), `fuente_no_activa` (`detalle.estado`) o `limite_preguntas` (`detalle.maximo`, `detalle.detectadas`)."
          content:
            application/json:
              schema:
                "$ref": "../openapi.yaml#/components/schemas/ErrorCodigo"
              example:
                error: tipo_fuente_invalido
                message: "La fuente no es un balotario."
        "500":
          "$ref": "../openapi.yaml#/components/responses/ErrorInternoCodigo"
        "503":
          "$ref": "../openapi.yaml#/components/responses/ServicioNoDisponible"
  "/admin/fuentes/{id}/balotario/importaciones":
    post:
      operationId: balotario.Confirmar
      tags: [balotario]
      summary: "Confirmar la importación de un balotario"
      description: "Solo `admin`. Importa las preguntas válidas de la versión vigente como `borrador` con origen `balotario`, en una sola transacción, y la audita. Una versión se importa una sola vez."
      x-rol: admin
      parameters:
        - "$ref": "../openapi.yaml#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/schemas/ConfirmarImportacionRequest"
            example:
              version: 1
              proceso_id: 1
              especialidad_id: 2
              asignatura_id: 3
      responses:
        "201":
          description: "Importación creada."
          content:
            application/json:
              schema:
                "$ref": "#/schemas/ImportacionConfirmada"
              example:
                importacion_id: 1
                fuente_id: 5
                version: 1
                creadas: 40
                con_problemas: 2
                unica: 38
                multiple: 2
                con_alertas: 1
        "400":
          description: "`parametro_invalido` (`{id}`) o `cuerpo_invalido` (JSON mal formado o campo desconocido)."
          content:
            application/json:
              schema:
                "$ref": "../openapi.yaml#/components/schemas/ErrorCodigo"
              example:
                error: parametro_invalido
                message: "Parámetro inválido."
        "401":
          "$ref": "../openapi.yaml#/components/responses/NoAutenticado"
        "403":
          "$ref": "../openapi.yaml#/components/responses/AccesoDenegado"
        "404":
          description: "`no_encontrado`: la fuente no existe."
          content:
            application/json:
              schema:
                "$ref": "../openapi.yaml#/components/schemas/ErrorCodigo"
              example:
                error: no_encontrado
                message: "Registro no encontrado."
        "409":
          description: "`version_desactualizada` (`detalle.version_vigente`) o `ya_importado` (esta versión ya se importó; `detalle` con la importación previa)."
          content:
            application/json:
              schema:
                "$ref": "../openapi.yaml#/components/schemas/ErrorCodigo"
              example:
                error: version_desactualizada
                message: "La fuente tiene una versión más reciente; recarga la vista previa."
                detalle:
                  version_vigente: 2
        "413":
          "$ref": "../openapi.yaml#/components/responses/CuerpoDemasiadoGrande"
        "422":
          description: "`validacion` (`detalle.campos`), `tipo_fuente_invalido`, `fuente_no_activa`, `limite_preguntas`, `referencia_invalida` (proceso o área inexistente o no corresponde), `especialidad_invalida`, `especialidad_no_corresponde` o `sin_validas`."
          content:
            application/json:
              schema:
                "$ref": "../openapi.yaml#/components/schemas/ErrorCodigo"
              examples:
                validacion:
                  value:
                    error: validacion
                    message: "Datos inválidos."
                    detalle:
                      campos:
                        version: "debe ser un entero mayor que 0"
                sinValidas:
                  value:
                    error: sin_validas
                    message: "El balotario no tiene ninguna pregunta válida para importar."
        "500":
          "$ref": "../openapi.yaml#/components/responses/ErrorInternoCodigo"
        "503":
          "$ref": "../openapi.yaml#/components/responses/ServicioNoDisponible"
schemas:
  FuenteBalotario:
    type: object
    description: "Nunca incluye el nombre del archivo, el hash ni el contenido."
    required: [id, titulo, version, oficial_verificada, oficial_entidad]
    properties:
      id:
        type: integer
        format: int64
        minimum: 1
      titulo:
        type: string
      version:
        type: integer
        minimum: 1
      oficial_verificada:
        type: boolean
      oficial_entidad:
        type: [string, "null"]
  TotalesBalotario:
    type: object
    required: [validas, con_problemas, unica, multiple, con_alertas]
    properties:
      validas:
        type: integer
      con_problemas:
        type: integer
      unica:
        type: integer
      multiple:
        type: integer
      con_alertas:
        type: integer
  AlternativaBalotario:
    type: object
    required: [letra, texto, correcta]
    properties:
      letra:
        type: string
      texto:
        type: string
      correcta:
        type: boolean
  PreguntaBalotario:
    type: object
    required: [numero, linea_inicio, linea_fin, tipo, enunciado, alternativas, alertas_estructura]
    properties:
      numero:
        type: integer
      linea_inicio:
        type: integer
      linea_fin:
        type: integer
      tipo:
        "$ref": "#/schemas/PreguntaTipoBalotario"
      enunciado:
        type: string
      alternativas:
        type: array
        items:
          "$ref": "#/schemas/AlternativaBalotario"
      alertas_estructura:
        type: array
        items:
          type: string
        description: "Avisos de forma (por ejemplo, número de alternativas); no impiden importar."
  PreguntaTipoBalotario:
    type: string
    enum: [unica, multiple]
  ProblemaBalotario:
    type: object
    required: [numero, linea_inicio, linea_fin, motivos]
    properties:
      numero:
        type: [integer, "null"]
      linea_inicio:
        type: integer
      linea_fin:
        type: integer
      motivos:
        type: array
        items:
          type: string
        description: "Códigos de los motivos. Nunca se devuelve el texto del bloque: el admin lo busca por línea."
  PaginaProblemas:
    allOf:
      - "$ref": "../openapi.yaml#/components/schemas/PaginaMeta"
      - type: object
        required: [data]
        properties:
          data:
            type: array
            items:
              "$ref": "#/schemas/ProblemaBalotario"
    description: "Bloques con problemas, paginados. **Estricto**: `page` y `per_page` inválidos dan `400 parametro_invalido`."
  ImportacionBalotario:
    type: object
    description: "Importación de la versión vigente, si ya se hizo."
    required: [id, creadas, created_at]
    properties:
      id:
        type: integer
        format: int64
        minimum: 1
      creadas:
        type: integer
      created_at:
        type: string
        format: date-time
  OtraImportacion:
    type: object
    description: "Importación de otra versión de la misma fuente."
    required: [version, creadas, created_at]
    properties:
      version:
        type: integer
        minimum: 1
      creadas:
        type: integer
      created_at:
        type: string
        format: date-time
  VistaPreviaBalotario:
    type: object
    required: [fuente, ruta_revision, totales, preguntas, problemas, importacion, otras_importaciones, puede_confirmar, motivo_no_confirmable]
    properties:
      fuente:
        "$ref": "#/schemas/FuenteBalotario"
      ruta_revision:
        type: string
        enum: [estructural, verificacion_clave]
        description: "Informativa: el servidor la recalcula al aprobar."
      totales:
        "$ref": "#/schemas/TotalesBalotario"
      preguntas:
        type: array
        items:
          "$ref": "#/schemas/PreguntaBalotario"
        maxItems: 20
        description: "Hasta 20 preguntas válidas de muestra."
      problemas:
        "$ref": "#/schemas/PaginaProblemas"
      importacion:
        oneOf:
          - "$ref": "#/schemas/ImportacionBalotario"
          - type: "null"
      otras_importaciones:
        type: array
        items:
          "$ref": "#/schemas/OtraImportacion"
      puede_confirmar:
        type: boolean
      motivo_no_confirmable:
        type: [string, "null"]
        enum: [sin_validas, ya_importado, null]
        description: "Por qué no se puede confirmar; `null` si se puede."
  ConfirmarImportacionRequest:
    type: object
    required: [version, proceso_id, especialidad_id, asignatura_id]
    properties:
      version:
        type: integer
        minimum: 1
        description: "Versión que el admin vio en la vista previa; debe ser la vigente."
      proceso_id:
        type: integer
        format: int64
        minimum: 1
      especialidad_id:
        type: integer
        format: int64
        minimum: 1
        description: "Debe estar activa, ser de la institución del proceso y estar entre las profesiones de la fuente."
      asignatura_id:
        type: integer
        format: int64
        minimum: 1
        description: "Área inicial y provisional de todas las preguntas; debe estar asignada al proceso."
  ImportacionConfirmada:
    type: object
    required: [importacion_id, fuente_id, version, creadas, con_problemas, unica, multiple, con_alertas]
    properties:
      importacion_id:
        type: integer
        format: int64
        minimum: 1
      fuente_id:
        type: integer
        format: int64
        minimum: 1
      version:
        type: integer
        minimum: 1
      creadas:
        type: integer
      con_problemas:
        type: integer
      unica:
        type: integer
      multiple:
        type: integer
      con_alertas:
        type: integer
