                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Registro no encontrado."
        "413":
          $ref: "../openapi.yaml#/components/responses/CuerpoDemasiadoGrande"
        "422":
          description: "El cuerpo no cumple las reglas de validación (`validate`); el texto es el del validador."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Key: 'CreateInstitucionRequest.Nombre' Error:Field validation for 'Nombre' failed on the 'min' tag"
        "500":
          $ref: "../openapi.yaml#/components/responses/ErrorInternoTexto"
        "503":
          $ref: "../openapi.yaml#/components/responses/ServicioNoDisponible"
  /procesos/{id}/asignaturas:
    get:
      operationId: "catalogs.ListProcesoAsignaturas"
      tags: ["catalogs"]
      summary: "Asignaturas del proceso para el postulante"
      description: |
        Devuelve el conjunto de pesos que aplica a la especialidad de la sesión (las filas de esa especialidad si el proceso tiene alguna; si no, las de compatibilidad). La especialidad se toma de los claims de la sesión. No comprueba la institución del proceso (hueco conocido, #276).

        Rol: cualquier sesión válida (`usuario` o `admin`).
      x-rol: "autenticado"
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/Id"
      responses:
        "200":
          description: "Array de asignaturas del proceso (vacío si no hay)."
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/schemas/ProcesoAsignaturaItem"
        "400":
          description: "El id de la ruta no es un entero > 0."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "ID inválido."
        "401":
          $ref: "../openapi.yaml#/components/responses/NoAutenticado"
        "500":
          $ref: "../openapi.yaml#/components/responses/ErrorInternoTexto"
        "503":
          $ref: "../openapi.yaml#/components/responses/ServicioNoDisponible"
  /admin/procesos/{id}/asignaturas:
    get:
      operationId: "catalogs.ListProcesoAsignaturasAdmin"
      tags: ["catalogs"]
      summary: "Asignaturas de compatibilidad del proceso"
      description: |
        Devuelve solo las filas de compatibilidad (sin especialidad), sea cual sea la especialidad del admin.

        Rol: solo `admin`.
      x-rol: "admin"
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/Id"
      responses:
        "200":
          description: "Array de asignaturas (vacío si no hay)."
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/schemas/ProcesoAsignaturaItem"
        "400":
          description: "El id de la ruta no es un entero > 0."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "ID inválido."
        "401":
          $ref: "../openapi.yaml#/components/responses/NoAutenticado"
        "403":
          $ref: "../openapi.yaml#/components/responses/AccesoDenegado"
        "500":
          $ref: "../openapi.yaml#/components/responses/ErrorInternoTexto"
        "503":
          $ref: "../openapi.yaml#/components/responses/ServicioNoDisponible"
    post:
      operationId: "catalogs.AsignarAsignatura"
      tags: ["catalogs"]
      summary: "Asignar una asignatura al proceso"
      description: |
        Añade una fila de compatibilidad (sin especialidad). Si el proceso está activo, los pesos deben seguir sumando 100.

        Rol: solo `admin`.
      x-rol: "admin"
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/Id"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/schemas/AsignarAsignaturaRequest"
      responses:
        "201":
          description: "Asignatura asignada."
          content:
            "application/json":
              schema:
                $ref: "#/schemas/ProcesoAsignaturaItem"
        "400":
          description: "Id o cuerpo inválidos."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Cuerpo de solicitud inválido."
        "401":
          $ref: "../openapi.yaml#/components/responses/NoAutenticado"
        "403":
          $ref: "../openapi.yaml#/components/responses/AccesoDenegado"
        "404":
          description: "El registro no existe."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Registro no encontrado."
        "409":
          description: "La asignatura ya está asignada (`peso_duplicado`, formato con código), o el proceso está activo y la suma de pesos quedaría distinta de 100 (texto)."
          content:
            "application/json":
              schema:
                oneOf:
                  - $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
                  - $ref: "../openapi.yaml#/components/schemas/ErrorCodigo"
              examples:
                texto:
                  value:
                    error: "Conflicto: el proceso está activo y la suma de pesos quedaría en 80.00% (debe ser 100%). Desactívalo para reorganizar los pesos."
                peso_duplicado:
                  value:
                    error: "peso_duplicado"
                    message: "Esta asignatura ya está asignada al proceso."
        "413":
          $ref: "../openapi.yaml#/components/responses/CuerpoDemasiadoGrande"
        "422":
          description: "Datos inválidos (texto del validador) o la asignatura no existe (`Referencia inválida.: …`)."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Key: 'CreateInstitucionRequest.Nombre' Error:Field validation for 'Nombre' failed on the 'min' tag"
        "500":
          $ref: "../openapi.yaml#/components/responses/ErrorInternoTexto"
        "503":
          $ref: "../openapi.yaml#/components/responses/ServicioNoDisponible"
  /admin/procesos/{id}/asignaturas/{asignaturaId}:
    put:
      operationId: "catalogs.UpdateProcesoAsignatura"
      tags: ["catalogs"]
      summary: "Actualizar una asignatura del proceso"
      description: |
        Cambia preguntas, peso y coeficiente de una fila de compatibilidad. Si el proceso está activo, los pesos deben seguir sumando 100.

        Rol: solo `admin`.
      x-rol: "admin"
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/Id"
        - name: "asignaturaId"
          in: "path"
          required: true
          description: "Id de la asignatura. Entero > 0; si no, `400`."
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
          example: 3
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/schemas/ActualizarProcesoAsignaturaRequest"
      responses:
        "200":
          description: "Asignatura actualizada."
          content:
            "application/json":
              schema:
                $ref: "#/schemas/Mensaje"
              example:
                message: "Asignatura actualizada."
        "400":
          description: "Ids o cuerpo inválidos."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "ID de asignatura inválido."
        "401":
          $ref: "../openapi.yaml#/components/responses/NoAutenticado"
        "403":
          $ref: "../openapi.yaml#/components/responses/AccesoDenegado"
        "404":
          description: "El proceso no existe o la asignatura no está asignada."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Registro no encontrado."
        "409":
          description: "Conflicto con un registro existente o con el estado actual."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Conflicto: el proceso está activo y la suma de pesos quedaría en 80.00% (debe ser 100%). Desactívalo para reorganizar los pesos."
        "413":
          $ref: "../openapi.yaml#/components/responses/CuerpoDemasiadoGrande"
        "422":
          description: "El cuerpo no cumple las reglas de validación (`validate`); el texto es el del validador."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Key: 'CreateInstitucionRequest.Nombre' Error:Field validation for 'Nombre' failed on the 'min' tag"
        "500":
          $ref: "../openapi.yaml#/components/responses/ErrorInternoTexto"
        "503":
          $ref: "../openapi.yaml#/components/responses/ServicioNoDisponible"
    delete:
      operationId: "catalogs.DeleteProcesoAsignatura"
      tags: ["catalogs"]
      summary: "Quitar una asignatura del proceso"
      description: |
        Elimina una fila de compatibilidad. Si el proceso está activo, los pesos deben seguir sumando 100.

        Rol: solo `admin`.
      x-rol: "admin"
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/Id"
        - name: "asignaturaId"
          in: "path"
          required: true
          description: "Id de la asignatura. Entero > 0; si no, `400`."
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
          example: 3
      responses:
        "200":
          description: "Asignatura eliminada del proceso."
          content:
            "application/json":
              schema:
                $ref: "#/schemas/Mensaje"
              example:
                message: "Asignatura eliminada del proceso."
        "400":
          description: "Ids inválidos."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "ID de asignatura inválido."
        "401":
          $ref: "../openapi.yaml#/components/responses/NoAutenticado"
        "403":
          $ref: "../openapi.yaml#/components/responses/AccesoDenegado"
        "404":
          description: "El proceso no existe o la asignatura no está asignada."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Registro no encontrado."
        "409":
          description: "Conflicto con un registro existente o con el estado actual."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Conflicto: el proceso está activo y la suma de pesos quedaría en 80.00% (debe ser 100%). Desactívalo para reorganizar los pesos."
        "500":
          $ref: "../openapi.yaml#/components/responses/ErrorInternoTexto"
        "503":
          $ref: "../openapi.yaml#/components/responses/ServicioNoDisponible"
  /admin/procesos/{id}/pesos:
    get:
      operationId: "catalogs.ResumenPesos"
      tags: ["catalogs"]
      summary: "Resumen de pesos de un proceso (PE1)"
      description: |
        Estado de la configuración de pesos de cada especialidad del proceso y la suma de las filas de compatibilidad.

        Rol: solo `admin`.
      x-rol: "admin"
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/Id"
      responses:
        "200":
          description: "Resumen del proceso."
          content:
            "application/json":
              schema:
                $ref: "#/schemas/ResumenPesos"
        "400":
          description: "El id del proceso no es un entero > 0 (`parametro_invalido`)."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorCodigo"
              example:
                error: "parametro_invalido"
                message: "Parámetro inválido."
        "401":
          $ref: "../openapi.yaml#/components/responses/NoAutenticado"
        "403":
          $ref: "../openapi.yaml#/components/responses/AccesoDenegado"
        "404":
          description: "El proceso no existe (`no_encontrado`)."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorCodigo"
              example:
                error: "no_encontrado"
                message: "Proceso no encontrado."
        "500":
          $ref: "../openapi.yaml#/components/responses/ErrorInternoCodigo"
        "503":
          $ref: "../openapi.yaml#/components/responses/ServicioNoDisponible"
  /admin/procesos/{id}/pesos/{especialidadId}:
    get:
      operationId: "catalogs.ConfiguracionPesos"
      tags: ["catalogs"]
      summary: "Configuración de pesos de una especialidad (PE2)"
      description: |
        Devuelve la configuración guardada (`completa`) o, si nunca se guardó, `incompleta` con la plantilla de compatibilidad.

        Rol: solo `admin`.
      x-rol: "admin"
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/Id"
        - name: "especialidadId"
          in: "path"
          required: true
          description: "Id de la especialidad. Entero > 0; si no, `400`."
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
          example: 2
      responses:
        "200":
          description: "La configuración."
          content:
            "application/json":
              schema:
                $ref: "#/schemas/ConfiguracionPesos"
        "400":
          description: "Un id no es un entero > 0 (`parametro_invalido`)."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorCodigo"
              example:
                error: "parametro_invalido"
                message: "Parámetro inválido."
        "401":
          $ref: "../openapi.yaml#/components/responses/NoAutenticado"
        "403":
          $ref: "../openapi.yaml#/components/responses/AccesoDenegado"
        "404":
          description: "El proceso o la especialidad no existen (`no_encontrado`)."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorCodigo"
              example:
                error: "no_encontrado"
                message: "Proceso no encontrado."
        "500":
          $ref: "../openapi.yaml#/components/responses/ErrorInternoCodigo"
        "503":
          $ref: "../openapi.yaml#/components/responses/ServicioNoDisponible"
    put:
      operationId: "catalogs.GuardarPesos"
      tags: ["catalogs"]
      summary: "Guardar la configuración de pesos (PE3)"
      description: |
        Reemplaza **toda** la configuración de la especialidad en una transacción y la audita (`pesos.guardar`). Orden de validación: forma de cada área, áreas repetidas, Σ preguntas ≤ 200, Σ pesos = 100 ± 0.01. El área omitida sale de la configuración.

        Rol: solo `admin`.
      x-rol: "admin"
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/Id"
        - name: "especialidadId"
          in: "path"
          required: true
          description: "Id de la especialidad. Entero > 0; si no, `400`."
          schema:
            type: "integer"
            format: "int64"
            minimum: 1
          example: 2
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/schemas/GuardarPesosRequest"
      responses:
        "200":
          description: "Configuración guardada (`estado: completa`)."
          content:
            "application/json":
              schema:
                $ref: "#/schemas/ConfiguracionPesos"
        "400":
          description: "Id inválido (`parametro_invalido`) o cuerpo mal formado o con campos desconocidos (`cuerpo_invalido`)."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorCodigo"
              examples:
                parametro_invalido:
                  value:
                    error: "parametro_invalido"
                    message: "Parámetro inválido."
                cuerpo_invalido:
                  value:
                    error: "cuerpo_invalido"
                    message: "Cuerpo de solicitud inválido."
        "401":
          $ref: "../openapi.yaml#/components/responses/NoAutenticado"
        "403":
          $ref: "../openapi.yaml#/components/responses/AccesoDenegado"
        "404":
          description: "El proceso o la especialidad no existen (`no_encontrado`)."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorCodigo"
              example:
                error: "no_encontrado"
                message: "Proceso no encontrado."
        "409":
          description: "Un área se repite en el cuerpo (`peso_duplicado`, con `detalle.asignatura_id`)."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorCodigo"
              example:
                error: "peso_duplicado"
                message: "El área se repite en la configuración."
                detalle:
                  asignatura_id: 3
        "413":
          $ref: "../openapi.yaml#/components/responses/CuerpoDemasiadoGrande"
        "422":
          description: "Errores de validación: `validacion` (con `detalle.campos`), `referencia_invalida` (la asignatura o la especialidad no existen o están inactivas), `limite_preguntas` (con `detalle.suma_preguntas`) y `pesos_no_suman_100` (con `detalle.suma_pesos`)."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorCodigo"
              examples:
                validacion:
                  value:
                    error: "validacion"
                    message: "Datos de pesos inválidos."
                    detalle:
                      campos:
                        "areas[0].peso_porcentual": "decimales"
                referencia_invalida:
                  value:
                    error: "referencia_invalida"
                    message: "Referencia inválida."
                limite_preguntas:
                  value:
                    error: "limite_preguntas"
                    message: "La suma de preguntas supera el máximo de 200."
                    detalle:
                      suma_preguntas: 240
                pesos_no_suman_100:
                  value:
                    error: "pesos_no_suman_100"
                    message: "Los pesos deben sumar 100."
                    detalle:
                      suma_pesos: 90.0
        "500":
          $ref: "../openapi.yaml#/components/responses/ErrorInternoCodigo"
        "503":
          $ref: "../openapi.yaml#/components/responses/ServicioNoDisponible"
schemas:
  Mensaje:
    type: "object"
    description: "Confirmación de una mutación sin recurso."
    required: ["message"]
    properties:
      message:
        type: "string"
        example: "Estado actualizado."
  EstadoRequest:
    type: "object"
    description: "Cuerpo de los `PATCH …/estado`."
    required: ["estado"]
    properties:
      estado:
        type: "string"
        enum: ["activo", "inactivo"]
  InstitucionRequest:
    type: "object"
    required: ["nombre", "siglas"]
    properties:
      nombre:
        type: "string"
        minLength: 3
        maxLength: 150
        example: "Institución Ejemplo"
      siglas:
        type: "string"
        minLength: 2
        maxLength: 20
        example: "IEJ"
  Institucion:
    type: "object"
    required: ["id", "nombre", "siglas", "estado", "created_at"]
    properties:
      id:
        type: "integer"
        format: "int64"
        example: 1
      nombre:
        type: "string"
        example: "Institución Ejemplo"
      siglas:
        type: "string"
        example: "IEJ"
      estado:
        type: "string"
        enum: ["activo", "inactivo"]
      created_at:
        type: "string"
        description: "Fecha de creación en texto de PostgreSQL (`created_at::text`, p. ej. `2026-11-15 15:04:05.123456+00`); no es RFC 3339."
        example: "2026-11-15 15:04:05.123456+00"
  GradoRequest:
    type: "object"
    required: ["institucion_id", "nombre", "abreviatura", "nivel", "orden"]
    properties:
      institucion_id:
        type: "integer"
        format: "int64"
        minimum: 1
        example: 1
      nombre:
        type: "string"
        minLength: 2
        maxLength: 100
        example: "Grado Ejemplo"
      abreviatura:
        type: "string"
        minLength: 2
        maxLength: 20
        example: "GE"
      nivel:
        type: "string"
        enum: ["suboficial", "oficial"]
      orden:
        type: "integer"
        minimum: 1
        example: 1
  Grado:
    type: "object"
    required:
      - "id"
      - "institucion_id"
      - "institucion"
      - "nombre"
      - "abreviatura"
      - "nivel"
      - "orden"
      - "estado"
      - "created_at"
    properties:
      id:
        type: "integer"
        format: "int64"
        example: 1
      institucion_id:
        type: "integer"
        format: "int64"
        example: 1
      institucion:
        type: "string"
        example: "Institución Ejemplo"
      nombre:
        type: "string"
        example: "Grado Ejemplo"
      abreviatura:
        type: "string"
        example: "GE"
      nivel:
        type: "string"
        enum: ["suboficial", "oficial"]
      orden:
        type: "integer"
        example: 1
      estado:
        type: "string"
        enum: ["activo", "inactivo"]
      created_at:
        type: "string"
        description: "Fecha de creación en texto de PostgreSQL (`created_at::text`, p. ej. `2026-11-15 15:04:05.123456+00`); no es RFC 3339."
        example: "2026-11-15 15:04:05.123456+00"
  EspecialidadRequest:
    type: "object"
    required: ["institucion_id", "nombre", "codigo"]
    properties:
      institucion_id:
        type: "integer"
        format: "int64"
        minimum: 1
        example: 1
      nombre:
        type: "string"
        minLength: 3
        maxLength: 150
        example: "Especialidad Ejemplo"
      codigo:
        type: "string"
        minLength: 2
        maxLength: 20
        example: "ESP"
      nivel:
        type: "string"
        description: "Opcional: vacío o ausente = todos los niveles."
        enum: ["suboficial", "oficial", ""]
  Especialidad:
    type: "object"
    required:
      - "id"
      - "institucion_id"
      - "institucion"
      - "nombre"
      - "codigo"
      - "nivel"
      - "estado"
      - "created_at"
    properties:
      id:
        type: "integer"
        format: "int64"
        example: 1
      institucion_id:
        type: "integer"
        format: "int64"
        example: 1
      institucion:
        type: "string"
        example: "Institución Ejemplo"
      nombre:
        type: "string"
        example: "Especialidad Ejemplo"
      codigo:
        type: "string"
        example: "ESP"
      nivel:
        type: "string"
        description: "Vacío si la especialidad no restringe el nivel."
        enum: ["suboficial", "oficial", ""]
      estado:
        type: "string"
        enum: ["activo", "inactivo"]
      created_at:
        type: "string"
        description: "Fecha de creación en texto de PostgreSQL (`created_at::text`, p. ej. `2026-11-15 15:04:05.123456+00`); no es RFC 3339."
        example: "2026-11-15 15:04:05.123456+00"
  AsignaturaRequest:
    type: "object"
    required: ["nombre", "codigo"]
    properties:
      nombre:
        type: "string"
        minLength: 3
        maxLength: 100
        example: "Asignatura Ejemplo"
      codigo:
        type: "string"
        minLength: 2
        maxLength: 20
        example: "ASG"
  Asignatura:
    type: "object"
    required: ["id", "nombre", "codigo", "estado", "created_at"]
    properties:
      id:
        type: "integer"
        format: "int64"
        example: 1
