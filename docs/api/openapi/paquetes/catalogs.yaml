        Rol: solo `admin`.
      x-rol: "admin"
      parameters:
        - name: "institucion_id"
          in: "query"
          required: false
          description: "Filtra por institución; `0` o ausente = todas. Un valor negativo o no numérico da `400`."
          schema:
            type: "integer"
            format: "int64"
            minimum: 0
        - name: "tipo"
          in: "query"
          required: false
