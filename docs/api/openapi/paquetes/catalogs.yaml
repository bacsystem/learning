# Paquete catalogs (backend-dev). Rutas: backend/internal/catalogs/routes.go:23-67.
# Escrito leyendo el código (handler.go, pesos_handler.go, dto.go, pesos_dto.go).
# Contrato de apoyo: docs/api/serums-ia-e1-taxonomia.md §2 (pesos, PE1–PE3, PE5).
# Los handlers de catálogos son anteriores a SERUMS IA: responden ErrorTexto,
# salvo `peso_duplicado` y los endpoints de pesos, que responden ErrorCodigo.
paths:
  /instituciones:
    get:
      operationId: "catalogs.ListInstituciones"
      tags: ["catalogs"]
      summary: "Listar instituciones"
      description: |
        Lista instituciones. Devuelve un **array** (no `{data, total}`). Paginación estricta: `limit` entero de 1 a 100 (más se recorta a 100) o `all` (o ausente) para el catálogo completo, con un tope de 1000 filas; `page` (base 1) solo tiene efecto con un `limit` numérico. Un `limit` o `page` mal formado, o un filtro numérico inválido, da `400`.

        Rol: cualquier sesión válida (`usuario` o `admin`).
      x-rol: "autenticado"
      parameters:
        - name: "estado"
          in: "query"
          required: false
          description: "Filtra por estado. Cualquier otro valor no devuelve filas (no se valida)."
          schema:
            type: "string"
            enum: ["activo", "inactivo"]
        - $ref: "../openapi.yaml#/components/parameters/Limit"
        - $ref: "../openapi.yaml#/components/parameters/Page"
      responses:
        "200":
          description: "Array de instituciones (vacío si no hay)."
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/schemas/Institucion"
        "400":
          description: "Parámetro de consulta inválido (`limit`, `page`, `institucion_id` o `anio`)."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Parámetros de consulta inválidos."
        "401":
          $ref: "../openapi.yaml#/components/responses/NoAutenticado"
        "500":
          $ref: "../openapi.yaml#/components/responses/ErrorInternoTexto"
        "503":
          $ref: "../openapi.yaml#/components/responses/ServicioNoDisponible"
    post:
      operationId: "catalogs.CreateInstitucion"
      tags: ["catalogs"]
      summary: "Crear institución"
      description: |
        Crea un registro y lo audita.

        Rol: solo `admin`.
      x-rol: "admin"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/schemas/InstitucionRequest"
      responses:
        "201":
          description: "Registro creado."
          content:
            "application/json":
              schema:
                $ref: "#/schemas/Institucion"
        "400":
          description: "El cuerpo no es un JSON válido."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Cuerpo de solicitud inválido."
        "401":
          $ref: "../openapi.yaml#/components/responses/NoAutenticado"
        "403":
          $ref: "../openapi.yaml#/components/responses/AccesoDenegado"
        "409":
          description: "Conflicto con un registro existente o con el estado actual."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Ya existe una institución con esas siglas."
        "413":
          $ref: "../openapi.yaml#/components/responses/CuerpoDemasiadoGrande"
        "422":
          description: "El cuerpo no cumple las reglas de validación (`validate`); el texto es el del validador."
          content:
            "application/json":
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorTexto"
              example:
                error: "Key: 'CreateInstitucionRequest.Nombre' Error:Field validation for 'Nombre' failed on the 'min' tag"
        "500":
          $ref: "../openapi.yaml#/components/responses/ErrorInternoTexto"
        "503":
          $ref: "../openapi.yaml#/components/responses/ServicioNoDisponible"
  /instituciones/{id}:
