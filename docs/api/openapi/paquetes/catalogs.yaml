          schema:
            type: "string"
            enum: ["ascenso", "pase_efectividad", "admision"]
        - name: "anio"
          in: "query"
          required: false
          description: "Filtra por año; `0` o ausente = todos. Un valor negativo o no numérico da `400`."
          schema:
            type: "integer"
            minimum: 0
        - name: "estado"
          in: "query"
          required: false
          description: "Filtra por estado. Cualquier otro valor no devuelve filas (no se valida)."
          schema:
            type: "string"
            enum: ["activo", "inactivo"]
        - $ref: "../openapi.yaml#/components/parameters/Limit"
        - $ref: "../openapi.yaml#/components/parameters/Page"
