name: frontend

# Solo al publicar a producción: un tag de versión (p. ej. v1.2.0).
# No corre en pull requests ni en pushes a ramas.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

env:
  # El hook `prepare` (husky) no hace falta en CI.
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Misma versión que frontend/.nvmrc (el Dockerfile usa node:22.14.0-alpine3.21).
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # H37: unit tests (vitest).
      - name: Test
        run: npm test

      # H30: es.json y en.json deben tener las mismas claves, sin valores vacíos y con los mismos placeholders.
      - name: i18n keys in sync
        run: node scripts/check-i18n.mjs

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
